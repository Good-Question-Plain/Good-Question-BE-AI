[project]
name = "good-question-be-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.69",
    "fastapi[standard]>=0.141.1",
    "groq>=1.6.0",
    "openai>=3.1.0",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "redis[asyncio]>=8.1.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
